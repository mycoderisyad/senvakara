name: Release

# Builds the Windows release: a portable zip and the NSIS installer.
# - Push a tag `vX.Y.Z` (matching the workspace version) to publish a GitHub Release.
# - Run it by hand (Actions tab, "Run workflow") to get the files as a build artifact only.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # `gh release create`

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      # Same toolchain as local builds: Slint is pinned to 1.18.1 for rustc 1.94.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release

      - name: Read version
        id: version
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match workspace version $version"
            exit 1
          fi

      - name: Build
        run: cargo build --release --locked -p senvakara

      - name: Install cargo-packager
        run: cargo install cargo-packager --version 0.11.8 --locked

      - name: Build NSIS installer
        working-directory: apps/senvakara
        run: cargo packager --release --formats nsis

      - name: Collect files
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          New-Item -ItemType Directory -Force dist, portable | Out-Null
          Copy-Item target/release/senvakara.exe, LICENSE, apps/senvakara/resources/THIRD_PARTY_NOTICES.md portable/
          Compress-Archive -Path portable/* -DestinationPath "dist/senvakara_${v}_x64-portable.zip"
          Copy-Item target/release/bundle/*-setup.exe dist/
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: senvakara-${{ steps.version.outputs.version }}-windows
          path: dist/*

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "Senvakara $GITHUB_REF_NAME" --generate-notes
