name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    # Windows: the desktop client and ConPTY adapter target Windows first.
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      # Same toolchain as local builds (keep in step with release.yml); `stable`
      # brings new Clippy lints every release and breaks `-D warnings`.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Rust fmt
        run: cargo fmt --all --check
      - name: Rust clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test --workspace
