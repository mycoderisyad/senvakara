[workspace]
resolver = "2"
members = ["crates/*", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
anyhow = "1"

# Release profile for the desktop binary (profiles only apply at workspace root).
# See https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Keep debug builds small (the full debug info of all dependencies filled the
# disk): line tables for our code, no debug info for third-party crates.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
