[workspace]
resolver = "2"
members = ["crates/*", "apps/senvakara"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
anyhow = "1"

# Release profile for the desktop binary (profiles only apply at workspace root).
# Size-oriented release settings for the desktop binary.
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "unwind"  # a panic in one task must not take the whole app down
strip = true

# Keep debug builds small (the full debug info of all dependencies filled the
# disk): line tables for our code, no debug info for third-party crates.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
