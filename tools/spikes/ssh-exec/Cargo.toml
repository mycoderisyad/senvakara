# Phase 0 spike 2 (WF): remote script execution over russh (sudo -S + EOF,
# separate stdout/stderr, cancel by process group, timeout, output cap, SFTP
# upload to a 0700 run dir). Not a workspace member.
[workspace]

[package]
name = "spike-ssh-exec"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
senvakara-adapters-ssh = { path = "../../../crates/adapters-ssh" }
# Same pins and features as crates/adapters-ssh.
russh = { version = "=0.65.2", default-features = false, features = ["ring", "flate2", "rsa"] }
russh-sftp = "=3.0.1"
tokio = { version = "1", features = ["rt", "macros", "net", "io-util", "sync", "time"] }
anyhow = "1"

# Keep the spike's target dir small.
[profile.dev]
debug = false
incremental = false

[profile.dev.package."*"]
debug = false
opt-level = 1
