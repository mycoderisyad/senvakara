[package]
name = "senvakara-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Senvakara Windows desktop shell (Tauri 2)"

[lib]
# Distinct lib name avoids bin/lib name clash on Windows (cargo#8519).
name = "senvakara_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
senvakara-core = { path = "../../../crates/core" }
senvakara-adapters-pty = { path = "../../../crates/adapters-pty" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
senvakara-storage = { path = "../../../crates/storage" }
senvakara-secrets = { path = "../../../crates/secrets" }
senvakara-adapters-ssh = { path = "../../../crates/adapters-ssh" }
senvakara-adapters-adb = { path = "../../../crates/adapters-adb" }
senvakara-adapters-scrcpy = { path = "../../../crates/adapters-scrcpy" }
senvakara-metrics = { path = "../../../crates/metrics" }
sysinfo = { version = "0.38", default-features = false, features = ["system", "disk", "network"] }
tauri-plugin-dialog = "2.8"
tokio = { version = "1", features = ["sync", "time", "fs", "process", "io-util", "macros"] }
anyhow.workspace = true
tokio-tungstenite = "0.30"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.11"
