[package]
name = "senvakara-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Senvakara headless service layer: hosts, terminals, files, Android, mirroring, remote desktop, workflows (no UI toolkit)"

[dependencies]
senvakara-core = { path = "../core" }
senvakara-adapters-pty = { path = "../adapters-pty" }
senvakara-storage = { path = "../storage" }
senvakara-secrets = { path = "../secrets" }
senvakara-adapters-ssh = { path = "../adapters-ssh" }
senvakara-adapters-adb = { path = "../adapters-adb" }
senvakara-adapters-scrcpy = { path = "../adapters-scrcpy" }
senvakara-metrics = { path = "../metrics" }
# Pinned to 0.38: 0.39+ requires rustc 1.95 (toolchain here: 1.94).
sysinfo = { version = "0.38", default-features = false, features = ["system", "disk", "network"] }
tokio = { version = "1", features = ["rt", "sync", "time", "fs", "process", "io-util", "macros", "net"] }
anyhow.workspace = true
serde.workspace = true
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.11"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading"] }

[dev-dependencies]
# UI-MIG-04 spike (examples/vnc_probe.rs).
vnc-rs = "=0.6.1"
png = "0.18"
tokio = { version = "1", features = ["rt-multi-thread"] }
