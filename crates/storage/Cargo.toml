description = "SQLite persistence for hosts, endpoints, devices and routes (no secrets)"

[dependencies]
rusqlite = { version = "0.43", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
serde.workspace = true
thiserror.workspace = true
serde_json = "1"
