[package]
name = "senvakara-workflow"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Workflow graph model, bundled module catalog, parameter validation and run plans (no I/O)"

[dependencies]
serde.workspace = true
serde_json = "1"
# Module manifests (`module.toml`). Already in the lock through the build
# tooling; parsing only, no serialisation needed.
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }
