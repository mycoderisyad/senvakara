name: sv-forgejo

services:
  server:
    image: codeberg.org/forgejo/forgejo:17
    restart: unless-stopped
    environment:
      - USER_UID=1000
      - USER_GID=1000
    ports:
      - "${BIND}:${PORT}:3000"
      - "${BIND}:${SSH_PORT}:22"
    volumes:
      - data:/data
      - /etc/localtime:/etc/localtime:ro

volumes:
  data:
