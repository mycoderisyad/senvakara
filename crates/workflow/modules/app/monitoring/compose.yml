name: sv-monitoring

# All three services use the host network so Prometheus can read node-exporter's
# host-wide network metrics. Prometheus and node-exporter listen on 127.0.0.1 only.
services:
  prometheus:
    image: prom/prometheus:v3.16.0
    restart: unless-stopped
    network_mode: host
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${RETENTION_DAYS}d
      - --web.listen-address=127.0.0.1:9090
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.13.1
    restart: unless-stopped
    network_mode: host
    pid: host
    command:
      - --path.rootfs=/host
      - --web.listen-address=127.0.0.1:9100
    volumes:
      - /:/host:ro,rslave

  grafana:
    image: grafana/grafana:13.3.2
    restart: unless-stopped
    network_mode: host
    environment:
      GF_SERVER_HTTP_ADDR: ${BIND}
      GF_SERVER_HTTP_PORT: ${PORT}
      GF_SECURITY_ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana-datasource.yml:/etc/grafana/provisioning/datasources/sv-prometheus.yml:ro

volumes:
  prometheus_data:
  grafana_data:
