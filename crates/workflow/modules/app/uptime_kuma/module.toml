id = "app.uptime_kuma"
name = "Uptime Kuma"
category = "app"
summary = "Uptime Kuma, a self-hosted monitoring dashboard that checks websites and services and alerts you, run as a Docker container. Needs the Docker Engine node first."
version = 1
executor = "ssh_script"
os = ["debian>=12", "ubuntu>=22.04"]
needs = ["root", "install"]
timeout_secs = 1200
docs_url = "https://github.com/louislam/uptime-kuma/wiki/%F0%9F%94%A7-How-to-Install"

[[params]]
name = "bind"
label = "Listen on"
kind = "choice"
options = ["127.0.0.1", "0.0.0.0"]
default = "127.0.0.1"
help = "127.0.0.1: only this server (put Caddy or Nginx in front). 0.0.0.0: every network interface; Docker published ports bypass ufw, so anyone who can reach the port can reach the app."

[[params]]
name = "port"
label = "Web port on the host"
kind = "port"
default = 3001
help = "The first visit asks you to create the admin account, so do that right after the install."
