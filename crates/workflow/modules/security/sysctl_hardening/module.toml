id = "security.sysctl_hardening"
name = "Network kernel settings"
category = "security"
summary = "Sets conservative kernel network options: SYN cookies on, ICMP redirects and source routing off, martian packets logged. IP forwarding is left alone, so Docker and VPNs keep working."
version = 1
executor = "ssh_script"
os = ["debian>=12", "ubuntu>=22.04"]
needs = ["root", "network"]
timeout_secs = 120
docs_url = "https://manpages.debian.org/bookworm/procps/sysctl.8.en.html"
